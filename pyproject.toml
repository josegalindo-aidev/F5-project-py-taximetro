[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taximetro"
version = "0.3.0.dev0"
description = "Taxímetro digital (TTX-247) - prototipo de TaxiTech Solutions"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
sql = ["sqlalchemy>=2.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
taximetro = "taximetro.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/taximetro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/taximetro/core"]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
src = [".", "src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
